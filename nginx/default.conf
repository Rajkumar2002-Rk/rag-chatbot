# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name chatbot.rajkumarai.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chatbot.rajkumarai.dev;

    ssl_certificate     /etc/letsencrypt/live/chatbot.rajkumarai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.rajkumarai.dev/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React app — all non-API routes fall through to index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI (strip /api prefix)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
